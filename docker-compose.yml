# docker-compose.yml
#
# Three services:
#   chat     -- Gradio live chat (http://localhost:7860)
#   api      -- FastAPI backend  (http://localhost:8000)
#   pipeline -- ArXiv paper watcher (runs once then exits)
#
# Run everything:  docker compose up
# Chat only:       docker compose up chat
# Pipeline only:   docker compose run pipeline
# Stop:            docker compose down

services:

  # Live Chat UI
  chat:
    build: .
    command: python app/chat.py
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./src:/app/src
      - ./app:/app/app
    env_file:
      - .env
    environment:
      - CHUNKS_PATH=data/processed/chunks_paragraph.json
      - EMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - TOP_K=5
    restart: unless-stopped

  # FastAPI Backend
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./src:/app/src
      - ./api:/app/api
    env_file:
      - .env
    restart: unless-stopped

  # ArXiv Data Pipeline (runs once and exits)
  pipeline:
    build: .
    command: python pipeline/arxiv_watcher.py
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./src:/app/src
      - ./pipeline:/app/pipeline
    env_file:
      - .env
    environment:
      - WANDB_ENTITY=ngangada-arizona-state-university
      - CHROMA_PATH=/app/data/chroma_pipeline
    restart: "no"